name: Auto Pack & Release Rime Liur

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'backups/**'
      - '.gitignore'
  workflow_dispatch: # 支援手動隨時在 GitHub 點擊按鈕觸發

jobs:
  pack-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Release Tag
        id: vars
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release Tag: $TAG_NAME"

      - name: Build Android & Windows Packages
        run: |
          mkdir -p dist

          # 1. 打包 Android 同文輸入法 (Trime) 專用精準安裝包 (rime_liur_android.zip)
          zip -q dist/rime_liur_android.zip \
            liur.schema.yaml \
            default.yaml \
            default.custom.yaml \
            liur.custom.yaml \
            trime.custom.yaml \
            liur_shyam_*.trime.yaml \
            liur.extended.dict.yaml \
            liur_customWords.dict.yaml \
            liur_Trad.dict.yaml \
            liur_TradExt.dict.yaml \
            liur_TradToSimp.dict.yaml \
            liur_English.dict.yaml \
            liur_Japan.dict.yaml

          if [ -d "opencc" ]; then
            zip -rq dist/rime_liur_android.zip opencc/
          fi
          echo "Android 安裝包打包完成: $(ls -lh dist/rime_liur_android.zip)"

          # 2. 打包 Windows 小狼毫 (Weasel) 一鍵安裝包 (rime_liur_windows.zip)
          zip -q dist/rime_liur_windows.zip \
            *.yaml \
            1_Install_Windows.cmd

          if [ -d "opencc" ]; then
            zip -rq dist/rime_liur_windows.zip opencc/
          fi
          echo "Windows 安裝包打包完成: $(ls -lh dist/rime_liur_windows.zip)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "嘸蝦米 Liu Shyam 特製版 ${{ steps.vars.outputs.tag }}"
          body: |
            ### 嘸蝦米 Liu - 同文 & 小狼毫專用特製版 (${{ steps.vars.outputs.tag }})

            本版本由 GitHub Actions 自動依據主幹最新配置封裝發布。

            ---

            ### 📱 Android 同文輸入法 (Trime) 30 秒極速安裝：
            1. 下載下方資源中的 **`rime_liur_android.zip`**
            2. 打開手機端 **同文輸入法 (Trime)** App
            3. 進入 **「主題 / 方案」** ➔ 點擊右上角 **「從 ZIP 匯入」**
            4. 選取剛剛下載的 `rime_liur_android.zip`
            5. 在主題中選取最新 **`liur_Shyam_2026.11`**，點選 **「重新部署」** 即可完成！

            ---

            ### 💻 Windows 小狼毫 (Weasel) 一鍵安裝：
            1. 下載下方資源中的 **`rime_liur_windows.zip`**
            2. 解壓縮後直接雙擊執行 **`1_Install_Windows.cmd`**
            3. 程式自動完成複製與重新部署，按 `Ctrl + \` 或 `F4` 切換即可開始打字！
          files: |
            dist/rime_liur_android.zip
            dist/rime_liur_windows.zip
